plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.destinytg.device'
    compileSdk 35

    defaultConfig {
        applicationId 'com.destinytg.device'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        python {
            version '3.11'
            pip {
                install 'kurigram==2.2.25'
            }
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('DESTINY_KEYSTORE')
            if (!keystorePath && file("${rootDir}/release-key.jks").exists()) {
                keystorePath = "${rootDir}/release-key.jks"
            }

            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv('DESTINY_STORE_PASSWORD') ?: 'destiny123'
                keyAlias System.getenv('DESTINY_KEY_ALIAS') ?: 'destiny-release'
                keyPassword System.getenv('DESTINY_KEY_PASSWORD') ?: 'destiny123'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
                debuggable false
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    sourceSets.main.python.srcDirs = ['src/main/python']

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    testImplementation 'junit:junit:4.13.2'
}