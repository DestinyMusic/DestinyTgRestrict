plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.destinytg.device'
    compileSdk 35

    defaultConfig {
        applicationId 'com.destinytg.device'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        python {
            version '3.11'
            pip {
                install 'kurigram==2.2.25'
            }
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('DESTINY_KEYSTORE')
            if (!keystorePath && file("${rootDir}/release-key.jks").exists()) {
                keystorePath = "${rootDir}/release-key.jks"
            }

            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv('DESTINY_STORE_PASSWORD') ?: 'destiny123'
                keyAlias System.getenv('DESTINY_KEY_ALIAS') ?: 'destiny-release'
                keyPassword System.getenv('DESTINY_KEY_PASSWORD') ?: 'destiny123'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
                debuggable false
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    sourceSets.main.python.srcDirs = ['src/main/python']

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}