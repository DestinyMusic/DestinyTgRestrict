name: Deploy Restrict Engine to Hugging Face Space

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Export only web deployment files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          set -e
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Missing HF_TOKEN secret or HF_SPACE_ID variable."
            exit 1
          fi

          export SYNC_DIR="/tmp/hf-web-sync"
          rm -rf "$SYNC_DIR"
          mkdir -p "$SYNC_DIR"

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='android-sdk' \
            --exclude='ios' \
            --exclude='**/__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='dist' \
            --exclude='*.apk' \
            --exclude='*.aab' \
            --exclude='.dockerignore' \
            --exclude='Dockerfile' \
            "$GITHUB_WORKSPACE"/ "$SYNC_DIR"/

          cd "$SYNC_DIR"
          rm -rf .git
          git init
          git checkout -b main

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install
          git lfs track "*.ttf"
          git lfs track "*.pyc"
          git lfs track "*.so"
          git lfs track "*.sqlite3"
          git lfs track "*.db"
          git lfs track "*.session"
          find . -type f -size +9M -exec git lfs track {} + || true

          git add .
          git commit -m "Auto-sync Restrict Engine to Hugging Face Space"

          HF_USER="${HF_SPACE_ID%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}.git" main

          echo "Pushed successfully to https://huggingface.co/spaces/${HF_SPACE_ID}"
