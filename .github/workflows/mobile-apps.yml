name: Build mobile apps

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd /tmp
          curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf cmdline-tools
          mkdir -p cmdline-tools
          unzip -q cmdline-tools.zip -d cmdline-tools
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android local.properties
        working-directory: android
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build universal installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: destiny-android-universal
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios/DestinyDevice.xcodeproj

      - name: Build unsigned iOS app
        run: >-
          xcodebuild -project ios/DestinyDevice.xcodeproj
          -scheme DestinyDevice
          -sdk iphoneos
          -configuration Release
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned iOS IPA
        run: |
          mkdir -p release-assets
          mkdir -p build/ios/Payload
          ditto build/ios/Build/Products/Release-iphoneos/DestinyDevice.app \
            build/ios/Payload/DestinyDevice.app
          (cd build/ios && zip -qry "$GITHUB_WORKSPACE/release-assets/Destiny-iOS-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: destiny-ios-unsigned
          path: release-assets/Destiny-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish device builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes